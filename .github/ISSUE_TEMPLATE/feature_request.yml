name: Feature request
description: Describe a use case that windows-network-ab could support.
body:
  - type: input
    id: environment
    attributes:
      label: Operating system and relevant runtime
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: What do you need to do?
      description: Describe the goal, input and expected output.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: How do you handle it today?
  - type: textarea
    id: options
    attributes:
      label: What change would help?
