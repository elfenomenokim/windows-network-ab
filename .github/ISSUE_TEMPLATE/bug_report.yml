name: Bug report
description: Report a reproducible problem with windows-network-ab.
body:
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and relevant runtime
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and steps
      description: Use example targets and remove private identifiers.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Observed result
    validations:
      required: true
